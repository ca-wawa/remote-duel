<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Duel Mat Prototype</title>
    <link rel="stylesheet" href="./styles.css?v=20260525-pile-size" />
    <script
      src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js"
      defer
    ></script>
    <script src="./scripts/config.js?v=20260524-structure" defer></script>
    <script src="./scripts/state.js?v=20260524-structure" defer></script>
    <script src="./scripts/room-sync.js?v=20260524-structure" defer></script>
    <script src="./scripts/deck-loader.js?v=20260524-structure" defer></script>
    <script src="./scripts/game-actions.js?v=20260524-structure" defer></script>
    <script src="./scripts/render-board.js?v=20260524-structure" defer></script>
    <script src="./scripts/render-panels.js?v=20260524-structure" defer></script>
    <script src="./scripts/render-controls.js?v=20260524-structure" defer></script>
    <script src="./scripts/interactions.js?v=20260524-structure" defer></script>
    <script src="./scripts/bootstrap.js?v=20260524-structure" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="メニューを開く"
        aria-controls="appMenu"
        aria-expanded="false"
      >
        menu
      </button>

      <div class="menu-backdrop" id="menuBackdrop" hidden></div>
      <aside class="app-menu" id="appMenu" aria-label="メニュー" hidden>
        <div class="menu-header">
          <div>
            <p class="eyebrow">settings</p>
            <h2>メニュー</h2>
          </div>
          <button class="subtle-button menu-close-button" id="menuCloseButton" type="button">
            閉じる
          </button>
        </div>

        <section class="menu-section">
          <h3>デッキ読込</h3>
          <div class="deck-toolbar" aria-label="デッキ読込">
            <div class="deck-chip">
              <span>自分</span>
              <strong id="deckName-self">未読込</strong>
              <label class="file-button">
                ZIP
                <input id="zipInput-self" type="file" accept=".zip" />
              </label>
            </div>
            <div class="deck-chip">
              <span>相手</span>
              <strong id="deckName-opponent">未読込</strong>
              <label class="file-button">
                ZIP
                <input id="zipInput-opponent" type="file" accept=".zip" />
              </label>
            </div>
            <button class="subtle-button deck-swap-button" id="swapDecksButton" type="button">
              自分/相手を入れ替え
            </button>
          </div>
        </section>

        <section class="menu-section room-section">
          <h3>オンライン対戦</h3>
          <div class="field-row">
            <label for="roomIdInput">ルーム</label>
            <input id="roomIdInput" type="text" autocomplete="off" placeholder="room-1234" />
          </div>
          <div class="field-row">
            <span>担当</span>
            <strong class="seat-status" id="seatStatus">未接続</strong>
          </div>
          <div class="control-grid seat-actions">
            <button class="primary-button" id="randomSeatButton" type="button" disabled>
              ランダム
            </button>
            <button class="subtle-button" id="claimFirstButton" type="button" disabled>
              自分が先攻
            </button>
            <button class="subtle-button" id="claimSecondButton" type="button" disabled>
              自分が後攻
            </button>
          </div>
          <div class="control-grid">
            <button class="primary-button" id="joinRoomButton" type="button">接続</button>
            <button class="subtle-button" id="leaveRoomButton" type="button" disabled>
              切断
            </button>
          </div>
          <p class="sync-status" id="syncStatus">未接続</p>
        </section>
      </aside>

      <main class="table-layout">
        <section class="play-area" aria-label="対戦盤面">
          <div class="playmat">
            <div class="player-side opponent-side" id="lane-opponent"></div>
            <div class="middle-line" data-empty-pending="true">
              <div class="pending-buttons" id="pendingButtons"></div>
            </div>
            <div class="player-side self-side" id="lane-self"></div>
            <div class="playmat-latest" id="statusText">デッキZIPを読み込んで開始できます。</div>
            <div class="reveal-layer" id="revealLayer" hidden>
              <div class="reveal-area" id="revealArea"></div>
            </div>
          </div>
        </section>

        <aside class="command-panel" aria-label="操作パネル">
          <section class="player-readout top-readout" id="opponentInfo"></section>

          <section class="control-section">
            <div class="turn-badge" id="turnBadge">待機中</div>
            <div class="field-row">
              <label for="viewerSelect">視点</label>
              <select id="viewerSelect">
                <option value="self">自分</option>
                <option value="opponent">相手</option>
              </select>
            </div>
            <div class="control-grid game-control-grid">
              <button class="primary-button" id="setupButton" type="button">ゲーム開始</button>
              <button class="subtle-button" id="resetButton" type="button">ゲーム終了</button>
              <button class="subtle-button wide-button" id="extraTurnButton" type="button">
                exターン追加
              </button>
            </div>
            <button class="end-turn-button" id="endTurnButton" type="button">ターン終了</button>
            <div class="control-grid turn-control-grid">
              <button class="subtle-button" id="untapButton" type="button">全アンタップ</button>
              <button class="subtle-button" id="drawButton" type="button">ドロー</button>
            </div>
          </section>

          <section class="control-section">
            <div id="selectionPanel" class="selection-panel muted">
              カードを選択してください。
            </div>
          </section>

          <section class="selected-preview-section" id="selectedPreviewSection" hidden>
            <div class="selected-preview" id="selectedPreview"></div>
          </section>

          <section class="hand-section">
            <h2>手札</h2>
            <div class="hand-panel" id="handPanel"></div>
          </section>

          <section class="player-readout bottom-readout" id="selfInfo"></section>

          <section class="log-section">
            <div class="log-header">
              <h2>ログ</h2>
              <button class="subtle-button" id="undoButton" type="button" disabled>取り消し</button>
            </div>
            <ol class="log-list" id="logList"></ol>
          </section>
        </aside>
      </main>
    </div>
  </body>
</html>
